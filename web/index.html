<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>RPi-Portal</title>
        <link rel="icon" href="resources/favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="resources/styles.css">
    </head>
    <body>
        <!--top bar with the funny buttons in it-->
        <nav>
            <ul class="nav">
                <li><a href="https://github.com/ah-yis/RPi-Portal">RPi-Portal</a></li>
                <li><h4>http://hostname:80</h4></li>
                <li><select name="game" id="game">
                    <option value="infinity">Infinity</option>
                    <option value="dimensions">Dimensions</option>
                    <option value="skylanders">Skylanders</option>
                </select></li>
                <li><button aria-label="Settings"><span class="icon-settings"></span></button></li>
                <li><button aria-label="Reboot"><span class="icon-reboot"></span></button></li>
                <li><button aria-label="Shutdown"><span class="icon-shutdown"></span></button></li>
            </ul>
        </nav>

            <!--um for settings you need:  
                1. theming
                2. check for updates
                3. about/credits/etc
            -->

            <!--settings is for nerds LMAOOOOO-->

        <div class="main-body">
          <div class="glyph">

            <button class="glyph-btn" id="glyphHex" data-slot="hex" data-occupied="true" aria-pressed="false" aria-label="Hex Slot">
              <span class="glyph-shape hex"></span>
            </button>

            <div class="glyph-row">

              <button class="glyph-btn" id="glyphP1" data-slot="p1" data-occupied="true" aria-pressed="false" aria-label="Player 1 Slot">
                <span class="glyph-shape circle1"></span>
              </button>

              <button class="glyph-btn" id="glyphP2" data-slot="p2" data-occupied="false" aria-pressed="false" aria-label="Player 2 Slot">
                <span class="glyph-shape circle2"></span>
              </button>

            </div>
          </div>
      
          <div class="figure-list" data-view="browse" id="figureList">
        
            <div class="browse-view">
            	<div class="picker-search">
            		<input type="search" id="figureSearch" placeholder="Search figures…" autocomplete="off" />
            	</div>
            
            	<div class="picker-categories" id="pickerCategories"></div>
            
            	<div class="picker-grid" id="pickerGrid"></div>
            </div>
        
            <div class="status-view" id="statusView"></div>
        
          </div>
        </div>

        <script src="scripts/nav.js"></script>
        <script src="scripts/search.js"></script>
        <script src="scripts/slot.js"></script>
    </body>
</html>
