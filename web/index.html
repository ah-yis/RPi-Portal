<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>nameless website</title>
        <link rel="icon" href="resources/favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="resources/styles.css">

    <body>
        <!--top bar with the funny buttons in it-->
        <nav>
            <ul class="nav">
                <li><a href="https://github.com/ah-yis/RPi-Portal">RPi-Portal</a></li>

            <!--um for settings you need:

                <!--this is for the glyph for the base's slots-->

            </div>
        </div>
